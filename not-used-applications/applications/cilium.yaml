apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://helm.cilium.io/
      chart: cilium
      targetRevision: 1.20.0-pre.0
      helm:
        releaseName: cilium
        valuesObject:
          # envoy:
          #   enabled: false
          #for gateway api
          gatewayAPI:
            enabled: true
          # #for host firewall:
          hostFirewall:
            enabled: true
          # #for UI:
          hubble:
            enabled: true
            relay:
              enabled: true
            #for cilium app in argocd out of sync:
            tls:
              auto:
                method: cronJob
            ui:
              enabled: true
              service:
                type: LoadBalancer
          # #mTLS
          # authentication:
          #   mutual:
          #     spire:
          #       enabled: true
          #     install:
          #       enabled: true
          # #for encrption:
          # encryption:
          #   enabled: true
          #   type: wireguard #ipsec
          #for istio integration:
          socketLB:
            hostNamespaceOnly: true
          cni:
            exclusive: false
          #for cilium kube proxy replacement:
          ipam:
            mode: kubernetes
          kubeProxyReplacement: true
          securityContext:
            capabilities:
              ciliumAgent:
                - CHOWN
                - KILL
                - NET_ADMIN
                - NET_RAW
                - IPC_LOCK
                - SYS_ADMIN
                - SYS_RESOURCE
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
              cleanCiliumState:
                - NET_ADMIN
                - SYS_ADMIN
                - SYS_RESOURCE
          cgroup:
            autoMount:
              enabled: false
            hostRoot: /sys/fs/cgroup
          k8sServiceHost: 192.168.64.105
          k8sServicePort: 6443
          operator:
            replicas: 1
            #https://blog.stonegarden.dev/articles/2024/02/bootstrapping-k3s-with-cilium/
            rollOutPods: true
          rollOutCiliumPods: true
    # - repoURL: https://github.com/UriZafrir/ansible-vllm-k8s.git
    #   targetRevision: talos
    #   path: extras/cilium-extras
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kube-system
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: true
    syncOptions:
