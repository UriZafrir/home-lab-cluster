apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-collector
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: 0.147.1
      helm:
        releaseName: opentelemetry-collector
        valuesObject:
          #https://clickhouse.com/docs/use-cases/observability/clickstack/integrations/kubernetes
          mode: daemonset
          image:
            repository: otel/opentelemetry-collector-contrib
          presets:
            logsCollection:
              enabled: true
              includeCollectorLogs: true
            hostMetrics:
              enabled: true
            kubernetesAttributes:
              enabled: true
              extractAllPodLabels: true
              extractAllPodAnnotations: true
            kubeletMetrics:
              enabled: true
          # kubectl create secret generic -n clickstack-operators-system hyperdx-secret --from-literal=HYPERDX_API_KEY=
          extraEnvs:
            - name: HYPERDX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hyperdx-secret
                  key: HYPERDX_API_KEY
                  optional: true
          config:
            extensions:
              health_check:
                endpoint: :13133
            processors:
              batch:
                send_batch_size: 1000
                timeout: 10s
            exporters:
              otlphttp:
                endpoint: "http://clickstack-otel-collector.clickstack-operators-system.svc:4318"
                # tls:
                #   insecure: true
                headers:
                  authorization: "${env:HYPERDX_API_KEY}"
                compression: gzip
            service:
              extensions: [health_check]
              pipelines:
                metrics:
                  exporters:
                    - otlphttp
                    - debug
                  processors:
                    - batch
                  receivers:
                    - hostmetrics
                logs:
                  exporters:
                    - otlphttp
                    - debug
                  processors:
                    - batch
                  receivers:
                    - filelog
    # - repoURL: https://github.com/UriZafrir/home-lab-cluster.git
    #   targetRevision: HEAD
    #   path: extras/opentelemetry-collector
  destination:
    server: "https://kubernetes.default.svc"
    namespace: clickstack-operators-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
