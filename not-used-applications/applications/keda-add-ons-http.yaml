apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda-add-ons-http
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://kedacore.github.io/charts
      chart: keda-add-ons-http 
      targetRevision: 0.14.1
      helm:
        releaseName: keda-add-ons-http
        valuesObject:
          logging:
            operator:
              # -- Logging level for KEDA http-add-on operator.
              # allowed values: `debug`, `info`, `error`, or an integer value greater than 0, specified as string
              level: debug
              stackTracesEnabled: false
            scaler:
              # -- Logging level for KEDA http-add-on Scaler.
              # allowed values: `debug`, `info`, `error`, or an integer value greater than 0, specified as string
              level: debug
              stackTracesEnabled: false
            interceptor:
              # -- Logging level for KEDA http-add-on Interceptor.
              # allowed values: `debug`, `info`, `error`, or an integer value greater than 0, specified as string
              level: debug
              stackTracesEnabled: false
          scaler:
            replicas: 1
          interceptor:
            replicas:
              min: 1
  destination:
    server: "https://kubernetes.default.svc"
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true