apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-autounseal
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://pytoshka.github.io/vault-autounseal
      chart: vault-autounseal
      targetRevision: 0.5.3
      helm:
        releaseName: vault-autounseal
        valuesObject:
          settings:
            vault_url: http://openbao.openbao-system.svc:8200
  destination:
    server: "https://kubernetes.default.svc"
    namespace: vault-autounseal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
