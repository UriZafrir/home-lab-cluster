apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-operator
      targetRevision: 0.102.0
      helm:
        releaseName: opentelemetry-operator
        valuesObject:
          admissionWebhooks:
            certManager:
              enabled: true
          manager:
            collectorImage:
              repository: otel/opentelemetry-collector-contrib
            #for prometheus to scrape it
            # prometheusRule:
            #   enabled: true
            # serviceMonitor:
            #   enabled: true
            
    - repoURL: https://github.com/UriZafrir/home-lab-cluster.git
      targetRevision: ubuntu
      path: extras/opentelemetry-operator
  destination:
    server: "https://kubernetes.default.svc"
    namespace: opentelemetry-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
