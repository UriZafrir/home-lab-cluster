apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitnexus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/UriZafrir/home-lab-cluster.git
      targetRevision: ubuntu
      path: extras/gitnexus
  destination:
    server: "https://kubernetes.default.svc"
    namespace: gitnexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true