apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bifrost
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/UriZafrir/opsiforce.git
      targetRevision: main
      path: helm/bifrost
      helm:
        releaseName: bifrost
        valuesObject:
          bifrost:
            image:
              tag: "v1.5.3"
            fullnameOverride: opsiforce-bifrost
            service:
              type: ClusterIP
            replicaCount: 1
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
            storage:
              mode: postgres
              configStore:
                enabled: true
              logsStore:
                enabled: true
            vectorStore:
              enabled: false
              type: none
            postgresql:
              enabled: false
              external:
                enabled: true
                host: local-pg-postgresql.local.svc.cluster.local
                port: 5432
                user: admin
                database: bifrost
                sslMode: disable
                existingSecret: opsiforce-bifrost-postgres
                passwordKey: password
            bifrost:
              encryptionKeySecret:
                name: opsiforce-bifrost-encryption
                key: key
              authConfig:
                isEnabled: true
                disableAuthOnInference: true
                existingSecret: opsiforce-bifrost-admin-auth
                usernameKey: username
                passwordKey: password
              client:
                enableLogging: true
                logRetentionDays: 7
                allowDirectKeys: false
              providers:
                openai:
                  keys:
                    - name: openai-primary
                      value: env.OPENAI_API_KEY
                      weight: 1
                      models: ["*"]
                  network_config:
                    default_request_timeout_in_seconds: 1200
                    max_retries: 2
                    retry_backoff_initial_ms: 500
                    retry_backoff_max_ms: 5000
                    stream_idle_timeout_in_seconds: 1200
                anthropic:
                  keys:
                    - name: anthropic-primary
                      value: env.ANTHROPIC_API_KEY
                      weight: 1
                      models: ["*"]
                  network_config:
                    default_request_timeout_in_seconds: 1200
                    max_retries: 2
                    retry_backoff_initial_ms: 500
                    retry_backoff_max_ms: 5000
                    stream_idle_timeout_in_seconds: 1200
              providerSecrets:
                openai:
                  existingSecret: opsiforce-bifrost-provider-keys
                  key: openai-api-key
                  envVar: OPENAI_API_KEY
                anthropic:
                  existingSecret: opsiforce-bifrost-provider-keys
                  key: anthropic-api-key
                  envVar: ANTHROPIC_API_KEY
              plugins:
                governance:
                  enabled: true
                logging:
                  enabled: true
  destination:
    server: "https://kubernetes.default.svc"
    namespace: opsiforce
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
