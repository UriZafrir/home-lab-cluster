apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: olm
  namespace: argocd
spec:
  project: default
  source:
    chart: olm
    repoURL: oci://ghcr.io/cloudtooling/helm-charts/olm
    targetRevision: 0.30.0
    helm:
      releaseName: olm
      valuesObject:
  destination:
    server: "https://kubernetes.default.svc"
    namespace: olm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
