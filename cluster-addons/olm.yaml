apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: operator-lifecycle-manager
  namespace: argocd
spec:
  project: default
  source:
    chart: operator-lifecycle-manager
    repoURL: https://github.com/operator-framework/operator-lifecycle-manager.git
    targetRevision: HEAD
    path: deploy/chart
    helm:
      releaseName: operator-lifecycle-manager
      valuesObject:
  destination:
    server: "https://kubernetes.default.svc"
    namespace: operator-lifecycle-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
