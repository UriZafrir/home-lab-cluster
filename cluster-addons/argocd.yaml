apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 7.7.10
      helm:
        releaseName: argocd
        valuesObject:
          server:
            service:
              type: NodePort
          configs:
            cm:
              kustomize.buildOptions: "--enable-helm"
    - repoURL: https://github.com/UriZafrir/home-lab-cluster.git
      targetRevision: HEAD
      path: extras/deployKF

  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    # automated:
    #   prune: false
    #   selfHeal: true
    syncOptions:
    - CreateNamespace=true
