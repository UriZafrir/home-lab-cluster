#first need to add kernel modules and increase inotify limits
#https://www.deploykf.org/guides/getting-started/#istio-kernel-modules
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow
  namespace: argocd
spec:
  project: default
  source:
    path: example
    repoURL: https://github.com/kubeflow/manifests
    targetRevision: HEAD
  destination:
    namespace: kubeflow
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
