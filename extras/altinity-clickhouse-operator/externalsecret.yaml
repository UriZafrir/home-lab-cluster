apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-clickhouse-creds
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-store
    kind: SecretStore
  target:
    name: langfuse-clickhouse-creds  # Regular K8s Secret created here
  dataFrom:
    - extract:
        key: langfuse-clickhouse-creds