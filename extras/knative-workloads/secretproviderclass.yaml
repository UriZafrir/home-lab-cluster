apiVersion: secrets-store.csi.x-k8s.io/v1alpha1
kind: SecretProviderClass
metadata:
  name: llm-api
spec:
  provider: openbao
  parameters:
    roleName: 'llm-app'
    objects: |
      - objectName: "mistral-api"
        secretPath: "secret/data/mistral-api"
        secretKey: "password"
  secretObjects:
  - secretName: mistral-api
    type: Opaque
    data:
    - objectName: mistral-api  # Must match above
      key: apiKey         # ENV var name in pod