apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-store
spec:
  provider:
    vault:
      server: "https://openbao.openbao-system.svc.cluster.local:8200"
      path: "secret"  # KV v2 mount path
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "llm-app"  # Reuse your existing role!
          serviceAccountRef:
            name: "llm-app"  # Your SA