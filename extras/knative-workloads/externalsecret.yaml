apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-mistral-secret
  namespace: knative-workloads
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-store
    kind: SecretStore
  target:
    name: mistral-api  # Regular K8s Secret created here
    creationPolicy: Owner
  data:
  - secretKey: apiKey
    remoteRef:
      key: mistral-api
      property: password