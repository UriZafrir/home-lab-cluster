apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mistral-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-store
    kind: SecretStore
  target:
    name: mistral-api  # Regular K8s Secret created here
  data:
  - secretKey: apiKey
    remoteRef:
      key: mistral-api
      property: password