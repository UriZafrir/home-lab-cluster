apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-salt
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-store
    kind: SecretStore
  target:
    name: langfuse-salt  # Regular K8s Secret created here
  data:
  - secretKey: apiKey
    remoteRef:
      key: langfuse-salt
      property: salt