apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: exa-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-store
    kind: SecretStore
  target:
    name: exa-credentials   # Regular K8s Secret created here
  data:
  - secretKey: EXA_API_KEY
    remoteRef:
      key: exa-credentials
      property: api-key