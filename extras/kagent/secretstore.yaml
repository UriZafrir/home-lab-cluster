apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-store
spec:
  provider:
    vault:
      server: "http://openbao-internal.openbao-system.svc.cluster.local:8200"
      path: "secret"  # KV mount path
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "llm-app"  # Reuse your existing role!
          serviceAccountRef:
            name: "llm-app"  # Your SA