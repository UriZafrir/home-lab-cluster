apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  labels:
    app: nginx
data:
  nginx.conf: |
    events {
        worker_connections 1024; # Example directive
    }
    http {
      server {
        listen 80;                    
        server_name argocd.192.168.0.105.nip.io;
          location / {
            proxy_pass http://argocd-server.argocd.svc.cluster.local:8096;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }
