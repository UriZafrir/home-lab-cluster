apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cilium-gateway
  namespace: gateway
  # annotations:
  #   networking.istio.io/service-type: NodePort
spec:
  gatewayClassName: cilium
  # addresses:
  #   - type: IPAddress
  #     value: "192.168.122.200"  # Your specific IP
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
