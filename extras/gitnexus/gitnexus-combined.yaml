#http://192.168.122.151:4173/?server=192.168.122.151:4747
#git config --global http.sslVerify false
#need port forwarding for server on 4747

# GitNexus Combined Deployment - Server + Web in same pod
# Both containers share network namespace, enabling localhost communication
---
apiVersion: v1
kind: Service
metadata:
  name: gitnexus-web
  labels:
    app: gitnexus-combined
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.122.151
  ports:
    - name: web
      port: 4173
      targetPort: 4173
      protocol: TCP
    - name: api
      port: 4747
      targetPort: 4747
      protocol: TCP
  selector:
    app: gitnexus-combined
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitnexus-combined
  labels:
    app: gitnexus-combined
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitnexus-combined
  template:
    metadata:
      labels:
        app: gitnexus-combined
    spec:
      containers:
        - name: gitnexus-server
          image: ghcr.io/abhigyanpatwari/gitnexus:latest
          ports:
            - containerPort: 4747
          volumeMounts:
            - name: gitnexus-data
              mountPath: /data/gitnexus
            - name: workspace
              mountPath: /workspace
              readOnly: true
          env:
            - name: WORKSPACE_DIR
              value: /workspace
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
        # GitNexus Web UI - connects to server via localhost
        - name: gitnexus-web
          image: ghcr.io/abhigyanpatwari/gitnexus-web:latest
          ports:
            - containerPort: 4173
          livenessProbe:
            httpGet:
              path: /
              port: 4173
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 4173
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "250m"
      volumes:
        - name: gitnexus-data
          persistentVolumeClaim:
            claimName: gitnexus-data
        - name: workspace
          hostPath:
            path: /mnt/data/general
            type: DirectoryOrCreate
      restartPolicy: Always
