# GitNexus Kubernetes Manifests
# Converted from docker-compose.yaml
---
# PersistentVolumeClaim for gitnexus-data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitnexus-data
  labels:
    app: gitnexus-server
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# Service for gitnexus-server
apiVersion: v1
kind: Service
metadata:
  name: gitnexus-server
  labels:
    app: gitnexus-server
spec:
  type: ClusterIP
  ports:
    - port: 4747
      targetPort: 4747
      protocol: TCP
  selector:
    app: gitnexus-server
---
# Deployment for gitnexus-server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitnexus-server
  labels:
    app: gitnexus-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitnexus-server
  template:
    metadata:
      labels:
        app: gitnexus-server
    spec:
      containers:
        - name: gitnexus-server
          image: ghcr.io/abhigyanpatwari/gitnexus:latest
          ports:
            - containerPort: 4747
          volumeMounts:
            - name: gitnexus-data
              mountPath: /data/gitnexus
            - name: workspace
              mountPath: /workspace
              readOnly: true
          env:
            - name: WORKSPACE_DIR
              value: /workspace
          livenessProbe:
            httpGet:
              path: /api/heartbeat
              port: 4747
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: 4747
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: gitnexus-data
          persistentVolumeClaim:
            claimName: gitnexus-data
        - name: workspace
          hostPath:
            path: ./workspace
            type: DirectoryOrCreate
      restartPolicy: Always
---
# Service for gitnexus-web
apiVersion: v1
kind: Service
metadata:
  name: gitnexus-web
  labels:
    app: gitnexus-web
spec:
  type: LoadBalancer
  ports:
    - port: 4173
      targetPort: 4173
      protocol: TCP
  selector:
    app: gitnexus-web
---
# Deployment for gitnexus-web
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitnexus-web
  labels:
    app: gitnexus-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitnexus-web
  template:
    metadata:
      labels:
        app: gitnexus-web
    spec:
      containers:
        - name: gitnexus-web
          image: ghcr.io/abhigyanpatwari/gitnexus-web:latest
          ports:
            - containerPort: 4173
          env:
            - name: VITE_GITNEXUS_SERVER_URL
              value: http://gitnexus-server:4747
          livenessProbe:
            httpGet:
              path: /
              port: 4173
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 4173
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "250m"
      restartPolicy: Always
