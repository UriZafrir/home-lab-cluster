apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openclaw
spec:
  parentRefs:
    - name: kgateway-gateway
      namespace: kgateway-system
  hostnames:
    - "openclaw.192.168.122.200.nip.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: myagent
          namespace: openclaw-operator 
          port: 18789