apiVersion: v1
kind: Pod
metadata:
  name: gpu-test-pod
spec:
  restartPolicy: Never
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"
  containers:
    - name: cuda-container
      image: docker.io/nvidia/cuda:12.0.0-base-ubuntu22.04
      command: ["nvidia-smi"]
