apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
spec:
  mode: daemonset  # This creates a DaemonSet
  # image: otel/opentelemetry-collector-k8s
  config: |
    receivers:
      hostmetrics:
        collection_interval: 30s
        scrapers:
          cpu: {}
          memory: {}
          disk: {}
          filesystem: {}
          network: {}
          load: {}
          paging: {}
          process: {}

    processors: {}

    exporters:
      # Native VictoriaMetrics OTLP HTTP metrics ingestion
      otlphttp/victoriametrics:
        # change service name / namespace as needed
        metrics_endpoint: http://vmsingle.default.svc.cluster.local:8428/opentelemetry/v1/metrics  # VictoriaMetrics docs example [web:19]
        compression: gzip
        encoding: proto

    service:
      pipelines:
        metrics:
          receivers: [hostmetrics]
          processors: []
          exporters: [otlphttp/victoriametrics]