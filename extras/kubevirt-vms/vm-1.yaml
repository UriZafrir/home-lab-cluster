#https://quay.io/repository/containerdisks/fedora
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: fedora
  labels:
    kubevirt.io/vm: vm-fedora
spec:
  runStrategy: Always
  template:
    metadata:
    spec:
      domain:
        devices:
          disks:
          - disk:
              bus: virtio
            name: containerdisk
          - disk:
              bus: virtio
            name: cloudinit
          interfaces:
            - name: default
              masquerade: {}
          rng: {}
        features:
          acpi: {}
          smm:
            enabled: true
        firmware:
          bootloader:
            efi:
              secureBoot: true
        resources:
          requests:
            memory: 1Gi
      networks:
      - name: default
        pod: {} # Stock pod network
        machine:
          type: ""
      terminationGracePeriodSeconds: 180
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/containerdisks/fedora:41
        - name: cloudinit
          cloudInitNoCloud:
            userData: |
              # The default username is: fedora
              #cloud-config
              chpasswd:
                expire: False
                list: |
                   fedora:fedora
              users:
                - name: fedora
                  shell: /bin/bash
                  lock_passwd: false
                  groups: sudo,wheel
                  sudo: ['ALL=(ALL) NOPASSWD:ALL']
                  ssh-authorized-keys:
                  - ssh-rsa ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICjfyR0TesyI0zSn92lLgsjTzTTkL8Ox9rBDKX/JThah
              ssh_pwauth: True
---
apiVersion: v1
kind: Service
metadata:
  name: vmsshservice
spec:
  externalTrafficPolicy: Cluster
  ports:
  - name: nodeport
    nodePort: 30000
    port: 27017
    protocol: TCP
    targetPort: 22
  selector:
    kubevirt.io/vm: vm-fedora
  type: NodePort
