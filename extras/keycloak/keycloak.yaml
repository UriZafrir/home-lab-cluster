apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
spec:
  instances: 1
  db:
    vendor: postgres
    usernameSecret:
      name: postgres-app
      key: username
    passwordSecret:
      name: postgres-app
      key: password
    host: postgres-rw.keycloak.svc.cluster.local
    database: app
  http:
    httpEnabled: true
  ingress:
    enabled: false
  hostname:
    strict: false