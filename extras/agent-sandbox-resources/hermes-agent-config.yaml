apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-config
data:
  config.yaml: |
    model:
      default: "deepseek/deepseek-v4-flash"
    dashboard:
      theme: "nous-blue"
    display:
      show_reasoning: true  # 💭 This forces the agent to prepend reasoning traces to your console/dashboard
