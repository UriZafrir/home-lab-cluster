apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
spec:
  type: LoadBalancer
  selector:
    agents.x-k8s.io/sandbox-name: hermes-agent
  ports:
    - name: api
      protocol: TCP
      port: 8642
      targetPort: 8642
    - name: dashboard
      protocol: TCP
      port: 9119
      targetPort: 9119
