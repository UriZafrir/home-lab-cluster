apiVersion: compute.gcp.upbound.io/v1beta2
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1beta2/instance
  labels:
    testing.upbound.io/example-name: instance_1
  name: instance-1
spec:
  forProvider:
    bootDisk:
      initializeParams:
        image: debian-cloud/debian-12
    machineType: g2-standard-16
    # metadata:
    #   environment: dev
    # metadataStartupScript: echo 'Upbound!' > /test.txt
    networkInterface:
      - accessConfig:
          - {}
        networkSelector:
          matchLabels:
            testing.upbound.io/example-name: network_1
        subnetworkSelector:
          matchLabels:
            testing.upbound.io/example-name: subnet_1
    # serviceAccount:
    #   emailSelector:
    #     matchLabels:
    #       testing.upbound.io/example-name: instance_1_sa
    #   scopes:
    #     - cloud-platform
    # tags:
    #   - foo
    #   - bar
    zone: us-east4-a