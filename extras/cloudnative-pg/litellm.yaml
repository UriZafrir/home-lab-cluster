apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-litellm
  namespace: litellm
spec:
  instances: 1
  bootstrap:
    initdb:
      database: litellm # <-- Creates the "litellm" database automatically
      owner: litellm_user # <-- Creates the user and makes them the owner
  storage:
    size: 10Gi
