apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: default
  sources:

    - repoURL: https://utkuozdemir.org/helm-charts
      chart: jellyfin
      targetRevision: 2.0.0
      helm:
        releaseName: jellyfin
        valuesObject:
          service:
            type: LoadBalancer
          persistence:
            data:
              enabled: true
              # existingClaim: longhorn-static-pvc-1
              storageClass: local-path
              size: 2Gi
              # isPvc: false
              # customVolume:
                # hostPath:
                #   path: /mnt/data
    - repoURL: https://github.com/UriZafrir/home-lab-cluster.git
      targetRevision: HEAD
      path: extras/longhorn
  destination:
    server: "https://kubernetes.default.svc"
    namespace: jellyfin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
