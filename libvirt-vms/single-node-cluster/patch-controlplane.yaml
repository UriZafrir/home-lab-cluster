machine:
  network:
    interfaces:
    - interface: eth0
      # vip:
      #   ip: 192.168.122.130
cluster:
  allowSchedulingOnControlPlanes: true
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
  apiServer:
    certSANs:
    - 127.0.0.1
    admissionControl:
      - name: PodSecurity
        configuration:
          exemptions:
            namespaces:
              - metallb-system
              - istio-system
              - monitoring
  # #this is needed for cilium
  proxy:
    disabled: true
  # this isn't
  # discovery:
  #   enabled: false
  etcd:
    advertisedSubnets:
    - 192.168.0.0/16
