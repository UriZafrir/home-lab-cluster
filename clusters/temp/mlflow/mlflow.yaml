apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
---  
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: community-charts
  namespace: flux-system
spec:
  interval: 1h
  url: https://community-charts.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: mlflow
  namespace: mlflow  # Adjust namespace as needed
spec:
  interval: 5m
  chart:
    spec:
      chart: mlflow
      version: 0.8.2  # Specify the desired version
      sourceRef:
        kind: HelmRepository
        name: community-charts
        namespace: flux-system
  values:
    # Add any custom values here
    # For example:
    # backendStore:
    #   databaseConnectionString: "sqlite:///mlflow.db"
