#vcluster connect vcluster -n vcluster
#vcluster connect vcluster -n vcluster --print
#https://www.vcluster.com/docs/vcluster/manage/accessing-vcluster
apiVersion: v1
kind: Namespace
metadata:
  name: vcluster
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: vcluster
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.loft.sh
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vcluster
  namespace: vcluster
spec:
  interval: 5m
  chart:
    spec:
      chart: vcluster
      version: "0.21.2"
      sourceRef:
        kind: HelmRepository
        name: vcluster
        namespace: flux-system
  values:
    syncer:
      extraArgs:
      - --tls-san=192.168.100.2

