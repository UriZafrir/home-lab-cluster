apiVersion: v1
kind: Namespace
metadata:
  name: pihole-system
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: mojo2600
  namespace: flux-system
spec:
  interval: 1h
  url: https://mojo2600.github.io/pihole-kubernetes/
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: pihole
  namespace: pihole-system
spec:
  interval: 15m
  chart:
    spec:
      chart: pihole
      version: '2.x.x'
      sourceRef:
        kind: HelmRepository
        name: mojo2600
        namespace: flux-system
  values:
    persistentVolumeClaim:
      enabled: true
    serviceWeb:
      loadBalancerIP: 192.168.100.1
      annotations:
        metallb.universe.tf/allow-shared-ip: pihole-svc
      type: LoadBalancer
    serviceDns:
      loadBalancerIP: 192.168.100.1
      annotations:
        metallb.universe.tf/allow-shared-ip: pihole-svc
      type: LoadBalancer