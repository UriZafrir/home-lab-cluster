apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: eck-operator
  namespace: flux-system
spec:
  interval: 1h
  url: https://helm.elastic.co
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: eck-operator
  namespace: operators
spec:
  interval: 5m
  chart:
    spec:
      chart: eck-operator
      version: 2.15.0
      sourceRef:
        kind: HelmRepository
        name: eck-operator
        namespace: flux-system
  values: