apiVersion: v1
kind: Namespace
metadata:
  name: ollama
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: ollama-helm
  namespace: flux-system
spec:
  interval: 1h
  url: https://otwld.github.io/ollama-helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: ollama
  namespace: ollama
spec:
  interval: 5m
  chart:
    spec:
      chart: ollama
      version: 1.1.0
      sourceRef:
        kind: HelmRepository
        name: ollama-helm
        namespace: flux-system
  values:
    ollama:
      models:
        pull:
          - llama3.2
    ingress:
      enabled: true
      annotations: 
        kubernetes.io/ingress.class: nginx
        kubernetes.io/tls-acme: "true"
      hosts:
      - host: ollama.local
        paths:
          - path: /
            pathType: Prefix
        tls: 
        - secretName: ollama-tls
          hosts:
            - ollama.local