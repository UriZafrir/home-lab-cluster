apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/BerriAI/litellm
    targetRevision: main
    path: deploy/charts/litellm-helm
    helm:
      releaseName: litellm
      valuesObject:
        service:
          type: LoadBalancer
        migrationJob:
          enabled: false
  destination:
    server: "https://kubernetes.default.svc"
    namespace: litellm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
