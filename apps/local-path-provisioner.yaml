apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-provisioner
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # - repoURL: https://charts.containeroo.ch
    #   chart: local-path-provisioner
    #   targetRevision: 0.0.33    
    #   helm:
    #     releaseName: local-path-provisioner
    #     valuesObject:
    #       storageClass:
    #         defaultClass: true
    #       nodePathMap:
    #         - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
    #           paths:
    #             - /var/mnt/local-path-provisioner
    - repoURL: https://github.com/UriZafrir/home-lab-cluster.git
      targetRevision: talos
      path: extras/local-path-provisioner
      helm:
        values: |
          storageClass:
            defaultClass: true
          nodePathMap:
            - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
              paths:
                - /var/mnt/local-path-provisioner
  destination:
    server: "https://kubernetes.default.svc"
    namespace: local-path-provisioner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
