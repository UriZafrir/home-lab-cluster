apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts/
      chart: grafana
      targetRevision: 11.3.6
      helm:
        releaseName: grafana
        valuesObject:
          envFromSecret: altinity-clickhouse-operator
          service:
            type: LoadBalancer
          plugins:
            - victoriametrics-metrics-datasource
          datasources:
            datasources.yaml:
              apiVersion: 1
              datasources:
              - name: ClickHouse-official
                type: grafana-clickhouse-datasource
                jsonData:
                  port: 9000
                  host: chi-clickhouse-clickhouse-0-0.monitoring.svc
                  username: ${username}
                  tlsSkipVerify: false
                  protocol: native
                secureJsonData:
                  password: ${password}
              - name: ClickHouse-vertamedia
                type: vertamedia-clickhouse-datasource
                url: http://chi-clickhouse-clickhouse-0-0.monitoring.svc:8123
              # - name: VictoriaMetrics
              #   type: prometheus
              #   url: http://vmselect-vmcluster.victoria-metrics-operator.svc:8481/select/0/prometheus
              #   access: proxy
              #   isDefault: true
          grafana.ini:
            users:
              default_theme: light
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
              - name: 'default'
                orgId: 1
                folder: ''
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/default
          dashboards:
            default:
              # node-exporter:
              #   title: node-exporter
              #   gnetId: 1860
              #   revision: 42
              #   datasource: VictoriaMetrics
              # k8s-dashboard:
              #   title: k8s-dashboard
              #   gnetId: 15661
              #   revision: 2
              #   datasource: VictoriaMetrics

    # - repoURL: https://github.com/UriZafrir/home-lab-cluster.git
    #   targetRevision: HEAD
    #   path: extras/grafana
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
