apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-collector
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: 0.134.0
      helm:
        releaseName: opentelemetry-collector
        valuesObject:
          service:
            enabled: true
          mode: daemonset
          # serviceMonitor:
          #   enabled: true
          # additionalLabels:
          #     release: kube-prometheus-stack
          ports:
            metrics:
              enabled: true
          image:
            repository: otel/opentelemetry-collector-contrib
          presets:
            logsCollection:
              enabled: true
              includeCollectorLogs: true
            hostMetrics:
              enabled: true
            
    # - repoURL: https://github.com/UriZafrir/home-lab-cluster.git
    #   targetRevision: HEAD
    #   path: extras/opentelemetry-collector
  destination:
    server: "https://kubernetes.default.svc"
    namespace: opentelemetry-collector-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
