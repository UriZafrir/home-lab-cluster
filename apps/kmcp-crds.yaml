apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kmcp-crds
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: oci://ghcr.io/kagent-dev/kmcp/helm/kagent-crds
    targetRevision: 0.5.5
    chart: kmcp-crds
    helm:
      releaseName: kmcp-crds
      valuesObject:
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kagent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
