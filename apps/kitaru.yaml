apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kitaru
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: oci://public.ecr.aws/zenml/kitaru
      chart: kitaru
      targetRevision: 0.13.1
      helm:
        releaseName: kitaru
        valuesObject:
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kitaru
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
