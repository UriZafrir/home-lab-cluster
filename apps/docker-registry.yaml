apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: docker-registry
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://twuni.github.io/docker-registry.helm
      chart: docker-registry
      targetRevision: 3.0.0
      helm:
        releaseName: docker-registry
        valuesObject:
          persistence:
            enabled: true
          configData:
            version: 0.1
            log:
              fields:
                service: registry
            storage:
              cache:
                blobdescriptor: inmemory
            http:
              #user addition
              cors:
                origins: ['http://192.168.122.101']
                methods: ['GET', 'POST', 'PUT', 'DELETE', 'HEAD', 'OPTIONS']
                headers: ['Authorization', 'Content-Type', 'Accept']
              #end user addition
              addr: :5000
              headers:
                X-Content-Type-Options: [nosniff]
              debug:
                addr: :5001
                prometheus:
                  enabled: false
                  path: /metrics
            health:
              storagedriver:
                enabled: true
                interval: 10s
                threshold: 3
  destination:
    server: "https://kubernetes.default.svc"
    namespace: docker-registry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
