apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plex
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: plex
    repoURL: https://utkuozdemir.org/helm-charts
    targetRevision: 2.1.1
    helm:
      releaseName: plex
      valuesObject:
        # image:
        #   repository: lscr.io/linuxserver/plex
        #   tag: latest
        service:
          type: LoadBalancer 
        persistence:
          data: 
            enabled: true
            isPvc: false
            customVolume:
              hostPath:
                path: /mnt/data/jellyfin-data/
        ingress:
          # -- Expose the app using an ingress
          enabled: true
          # -- Ingress class name
          className: "nginx"
          # -- Annotations for the ingress
          annotations:
            cert-manager.io/cluster-issuer: "ca-issuer"
            nginx.ingress.kubernetes.io/rewrite-target: /web/$2  # Rewrites /plex/foo → /web/foo
            nginx.ingress.kubernetes.io/use-regex: "true"  
          # -- Ingress hosts configuration
          # @default -- see [values.yaml](values.yaml)
          hosts:
            - host: in.uri.work.gd
              paths:
                - path: /plex(/|$)(.*)      # Captures everything after /plex
                  pathType: ImplementationSpecific
                  backend:
                    service:
                      name: plex
                      port:
                        number: 32400
          # -- The TLS configuration for the Ingress
          tls:
          - hosts:
            - in.uri.work.gd
            secretName: jellyfin-tls
        
  destination:
    server: "https://kubernetes.default.svc"
    namespace: plex
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true

