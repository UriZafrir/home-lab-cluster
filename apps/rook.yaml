apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  sources:
    - repoURL: https://charts.rook.io/release
      chart: rook
      targetRevision: 1.20.0-beta.0
      helm:
        releaseName: rook
        valuesObject:
  destination:
    server: "https://kubernetes.default.svc"
    namespace: rook
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
