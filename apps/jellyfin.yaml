apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://utkuozdemir.org/helm-charts
      chart: jellyfin
      targetRevision: 2.0.0
      helm:
        releaseName: jellyfin
        valuesObject:
          image:
            tag: latest
          service:
            type: LoadBalancer
          persistence:
            data:
              # enabled: true
              # storageClass: local-path
              # size: 20Gi
              enabled: true
              isPvc: false
              customVolume:
                hostPath:
                  path: /mnt/data/jellyfin-data/
            config:
              enabled: true
              isPvc: false
              customVolume:
                hostPath:
                  path: /mnt/data/jellyfin-config
          # podSecurityContext:
          #   runAsUser: 1000
          #   runAsGroup: 1000
          #   fsGroup: 1000
          # ingress:
          #   # -- Expose the app using an ingress
          #   enabled: true
          #   # -- Ingress class name
          #   className: "nginx"
          #   # -- Annotations for the ingress
          #   annotations:
          #     cert-manager.io/cluster-issuer: "letsencrypt-prod"
          #   # -- Ingress hosts configuration
          #   # @default -- see [values.yaml](values.yaml)
          #   hosts:
          #     - host: jellyfin.uri.cluster.gd
          #       paths:
          #         - path: /
          #           pathType: Prefix
          #           backend:
          #             service:
          #               name: jellyfin
          #               port:
          #                 number: 8096
          #   # -- The TLS configuration for the Ingress
          #   tls:
          #   - hosts:
          #     - jellyfin.uri.cluster.gd
          #     secretName: jellyfin-tls
    # - repoURL: https://github.com/UriZafrir/home-lab-cluster.git
    #   targetRevision: HEAD
    #   path: extras/longhorn
  destination:
    server: "https://kubernetes.default.svc"
    namespace: jellyfin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
