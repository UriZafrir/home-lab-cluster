apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-agent
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/ultraworkers/hermes-agent-helm-chart
      targetRevision: main
      path: "."
      helm:
        releaseName: hermes-agent
        valuesObject:
          image:
            tag: v2026.6.5
          service:
            enabled: false
            type: LoadBalancer
  destination:
    server: "https://kubernetes.default.svc"
    namespace: hermes-agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
