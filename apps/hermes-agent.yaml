apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-agent
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/UriZafrir/home-lab-cluster
      targetRevision: ubuntu
      path: "extras/hermes-agent-helm-chart"
      helm:
        releaseName: hermes-agent
        valuesObject:
          image:
            tag: v2026.6.5
          service:
            enabled: true
            type: LoadBalancer
          # s6-overlay in the image needs to start as root (uid 0) to manage /run
          # before dropping privileges internally. No capabilities or host access
          # are granted — the container-level securityContext (capabilities.drop: ALL,
          # allowPrivilegeEscalation: false, readOnlyRootFilesystem: true) still applies.
          podSecurityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          apiServer:
            enabled: true
          externalSecret:
            enabled: true
            refreshInterval: 1h
            secretStoreRef:
              kind: ClusterSecretStore
              name: openbao-store
            target:
              name: openrouter-secret-k8s
            data:
              - secretKey: OPENROUTER_API_KEY
                remoteRef:
                  key: OPENROUTER_API_KEY
                  property: api_key
  destination:
    server: "https://kubernetes.default.svc"
    namespace: hermes-agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
