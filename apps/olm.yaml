apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: olm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-98"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # chart: olm
    repoURL: https://github.com/operator-framework/operator-lifecycle-manager
    targetRevision: master
    path: deploy/chart
    helm:
      releaseName: olm
      valuesObject:
  destination:
    server: "https://kubernetes.default.svc"
    namespace: olm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true

