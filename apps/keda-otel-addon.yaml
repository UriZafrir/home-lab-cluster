apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda-otel-add-on
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: otel-add-on 
    repoURL: oci://ghcr.io/kedify/charts
    targetRevision: v0.1.3
    helm:
      releaseName: keda-otel-add-on
      valuesObject:
  destination:
    server: "https://kubernetes.default.svc"
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true