apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langfuse
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://langfuse.github.io/langfuse-k8s
      chart: langfuse
      targetRevision: 1.5.33
      helm:
        releaseName: langfuse
        valuesObject:
          langfuse:
            web:
              service:
                type: LoadBalancer
            salt:
              secretKeyRef:
                name: "langfuse-salt"
                key: "salt"
            # NextAuth configuration
            nextauth:
              secret:
                secretKeyRef:
                  name: "langfuse-salt"
                  key: "salt"
          postgresql:
            deploy: false
            host: postgres-langfuse-rw.langfuse
            auth:
              username: app
              database: app
              existingSecret: "postgres-langfuse-app"
              # -- The keys in the existing secret that contain the passwords. If using the default `postgres` user, both `userPasswordKey` and `adminPasswordKey` must be provided.
              secretKeys:
                userPasswordKey: password
    - repoURL: https://github.com/UriZafrir/home-lab-cluster.git
      targetRevision: ubuntu
      path: extras/langfuse
  destination:
    server: "https://kubernetes.default.svc"
    namespace: langfuse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
