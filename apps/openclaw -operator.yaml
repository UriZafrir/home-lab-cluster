apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: oci://ghcr.io/openclaw-rocks/charts/openclaw-operator
      chart: openclaw-operator
      targetRevision: 0.34.4
      helm:
        releaseName: openclaw-operator
        valuesObject:
  destination:
    server: "https://kubernetes.default.svc"
    namespace: openclaw-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
