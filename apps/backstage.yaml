apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/UriZafrir/home-lab-cluster.git
    targetRevision: HEAD
    path: extras/backstage
    # helm:
    #   valueFiles:
    #     - values.yaml
      # values: |
      #   service:
      #     type: LoadBalancer
  destination:
    server: "https://kubernetes.default.svc"
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
