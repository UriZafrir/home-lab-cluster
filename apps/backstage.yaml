apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
spec:
  project: default
  source:
    #https://github.com/backstage/backstage/tree/master/contrib/kubernetes/basic_kubernetes_example_with_helm/backstage
    repoURL: https://github.com/UriZafrir/home-lab-cluster.git
    targetRevision: HEAD
    path: extras/backstage-from-backstage
    helm:
      values: |
        app:
          service:
            type: LoadBalancer
          image:
            repository: local/backstage-app-frontend
            pullPolicy: Never
          extraEnvVarsSecrets:
            - backstage-secret
          extraEnvVars:
            - name: LOG_LEVEL
              value: debug
        backend:
          enabled: true
          # service:
          #   type: LoadBalancer
          image:
            repository: local/backstage-app-backend
            pullPolicy: Never
          extraEnvVarsSecrets:
            - backstage-secret
          extraEnvVars:
            - name: LOG_LEVEL
              value: debug
          # serviceAccount:
          #   create: true
        # service:
        #   type: LoadBalancer
        # backstage:
        #   command: []
        #   image:
        #     registry: docker.io
        #     repository: local/backstage-app
        #     pullPolicy: Never
        #   extraEnvVarsSecrets:
        #     - backstage-secret
        #   extraEnvVars:
        #     - name: LOG_LEVEL
        #       value: debug
        #     # - name: KUBERNETES_CLIENT_DEBUG # didn't work
        #     #   value: "true"
        # serviceAccount:
        #   create: true
        # rbac:
