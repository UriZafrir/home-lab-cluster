        # # diagnosticMode:
        # #   enabled: true
    # repoURL: oci://ghcr.io/backstage/charts/backstage
    # chart: backstage
    # targetRevision: 2.6.1
    # helm:
    #   valuesObject:
        # service:
        #   type: LoadBalancer
        # backstage:
        #   image:
        #     registry: local
        #     repository: backstage
        #     # pullPolicy: Never
        # serviceAccount:
        #   create: true
    #from https://github.com/backstage/backstage
    # repoURL: https://github.com/UriZafrir/home-lab-cluster.git
    # targetRevision: HEAD
    # path: extras/backstage-from-bitnami
    # helm:
    #   values: |
    #     service:
    #       type: LoadBalancer
    #     backstage:
    #       command: []
    #       image:
