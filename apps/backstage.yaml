apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
spec:
  project: default
  source:
    # repoURL: oci://ghcr.io/backstage/charts/backstage
    # chart: backstage
    # targetRevision: 2.6.1
    # helm:
    #   valuesObject:
        # service:
        #   type: LoadBalancer
        # backstage:
        #   image:
        #     registry: local
        #     repository: backstage
        #     # pullPolicy: Never
        # serviceAccount:
        #   create: true
    #from https://github.com/backstage/backstage
    repoURL: https://github.com/UriZafrir/home-lab-cluster.git
    targetRevision: HEAD
    path: extras/backstage
    helm:
      values: |
        service:
          type: LoadBalancer
        backstage:
          image:
            registry: docker.io
            repository: local/backstage-app
            pullPolicy: Never
          extraEnvVarsSecrets:
            - backstage-secret
          extraEnvVars:
            - name: LOG_LEVEL
              value: debug
            - name: KUBERNETES_CLIENT_DEBUG
              value: true
        serviceAccount:
          create: true
        rbac:
          create: true
  destination:
    server: "https://kubernetes.default.svc"
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
