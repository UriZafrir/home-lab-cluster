apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edgex
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
      - repoURL: https://github.com/UriZafrir/home-lab-cluster.git
        targetRevision: ubuntu
        path: extras/edgex-helm
      helm:
        releaseName: edgex
        valuesObject:
  destination:
    server: "https://kubernetes.default.svc"
    namespace: edgex
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
