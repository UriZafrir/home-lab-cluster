apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knative-eventing-blockchain-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/UriZafrir/home-lab-cluster.git
      targetRevision: ubuntu
      path: extras/knative-end-to-end-tutorial
  destination:
    server: "https://kubernetes.default.svc"
    namespace: knative-eventing-blockchain-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
