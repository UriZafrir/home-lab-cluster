apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-webui
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: open-webui
    repoURL: https://helm.openwebui.com
    targetRevision: 14.6.0
    helm:
      releaseName: open-webui
      valuesObject:
        # tika: enabled
        # service:
        #   type: LoadBalancer
        # tika:
        #   service:
        #     type: LoadBalancer
        # pipelines:
        #   service:
        #     type: LoadBalancer
        # ollama:
        #   service:
        #     type: LoadBalancer
        # knative:
        #   enabled: true
        # ollama:
        #   models:
        #     pull:
        #       - llama3.2
        #     run:
        #       - llama3.2

  destination:
    server: "https://kubernetes.default.svc"
    namespace: open-webui
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
