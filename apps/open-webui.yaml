apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-webui
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: open-webui
    repoURL: https://helm.openwebui.com
    targetRevision: 14.6.0
    helm:
      releaseName: open-webui
      valuesObject:
        ollamaUrls:
          - http://ollama.ollama.svc.cluster.local:11434
        route:
          enabled: true
          hostnames:
            - openwebui.192.168.122.200.nip.io
          parentRefs:
            - name: kgateway-gateway
              namespace: kgateway-system
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: /
        terminals:
          enabled: true
        tika:
          enabled: true
        tika:
          service:
            type: LoadBalancer
        pipelines:
          service:
            type: LoadBalancer
        ollama:
          enabled: false
          # gpu:
          #   enabled: true
          #   type: 'nvidia'
          #   number: 1
          # models:
          #   pull:
          #     - llama3.2
          #   run:
          #     - llama3.2

  destination:
    server: "https://kubernetes.default.svc"
    namespace: open-webui
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
