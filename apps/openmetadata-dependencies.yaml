apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openmetadata-dependencies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://helm.open-metadata.org
      chart: openmetadata-dependencies
      targetRevision: 2.0.4
      helm:
        releaseName: openmetadata-dependencies
        valuesObject:
          airflow:
            logs:
              persistence:
                enabled: false
            # Argo CD runs Helm post-install/post-upgrade hooks as PostSync hooks,
            # and PostSync only runs after every Sync resource is Healthy. The
            # api-server/scheduler/triggerer are never Healthy because their
            # wait-for-airflow-migrations init container waits for these very jobs.
            # Demoting them to plain resources breaks the deadlock.
            migrateDatabaseJob:
              useHelmHooks: false
            createUserJob:
              useHelmHooks: false
    # - repoURL: https://github.com/UriZafrir/home-lab-cluster.git
    #   targetRevision: ubuntu
    #   path: extras/openmetadata-dependencies
  destination:
    server: "https://kubernetes.default.svc"
    namespace: openmetadata
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
