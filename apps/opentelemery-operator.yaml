apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-collector
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: 0.134.0
      helm:
        releaseName: opentelemetry-collector
        valuesObject:
          mode: daemonset
          image:
            repository: otel/opentelemetry-collector-contrib
          # presets:
          #   logsCollection:
          #     enabled: true
          #     includeCollectorLogs: true
          #   hostMetrics:
          #     enabled: true
          # manager:
          #   collectorImage:
          #     repository: otel/opentelemetry-collector-contrib
            #for prometheus to scrape it
            # prometheusRule:
            #   enabled: true
            # serviceMonitor:
            #   enabled: true
            
    # - repoURL: https://github.com/UriZafrir/home-lab-cluster.git
    #   targetRevision: HEAD
    #   path: extras/opentelemetry-collector
  destination:
    server: "https://kubernetes.default.svc"
    namespace: opentelemetry-collector-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
