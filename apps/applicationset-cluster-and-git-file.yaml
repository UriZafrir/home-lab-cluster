apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: applicationset-cluster-and-git-file
  namespace: argocd
spec:
  goTemplate: true
  # goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/UriZafrir/home-lab-cluster.git
      revision: talos
      files:
        - path: applicationset-apps/*.json
  template:
    metadata:
      name: '{{.name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/UriZafrir/home-lab-cluster.git
        targetRevision: talos
        path: applicationset-apps/{{.name}}
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{- if .namespace }}{{ .namespace }}{{- else }}{{ .name }}{{- end }}'
# {{- if and .syncPolicy (eq .syncPolicy "automated") }}
