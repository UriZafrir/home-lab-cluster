apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-ebpf-instrumentation
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-ebpf-instrumentation
      targetRevision: 0.6.0
      helm:
        releaseName: opentelemetry-ebpf-instrumentation
        valuesObject:
          config:
            data:
              otel_traces_export:
                endpoint: "http://vtsingle-vtsingle.victoria-metrics-operator.svc:10428/insert/opentelemetry/v1/traces"
              otel_metrics_export:
                endpoint: "http://vmsingle-vmsingle.victoria-metrics-operator.svc:8428/opentelemetry/v1/metrics"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
