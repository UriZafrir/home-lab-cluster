apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph-cluster
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  sources:
    - repoURL: https://charts.rook.io/release
      chart: rook-ceph-cluster
      targetRevision: 1.19.4
      helm:
        releaseName: rook-ceph-cluster
        valuesObject:
          cephClusterSpec:
            mon:
              count: 1
            mgr:
              count: 1
            storage:  # ADD THIS SECTION
              storageClassDeviceSets:
                - name: set1
                  count: 1  # Single node, so 1 OSD
                  portable: false  # Longhorn volumes are node-specific
                  tuneDeviceClass: true
                  tuneFastDeviceClass: false
                  volumeClaimTemplates:
                    - metadata:
                        name: data
                      spec:
                        resources:
                          requests:
                            storage: 50Gi  # Adjust size as needed
                        storageClassName: longhorn
                        volumeMode: Block
                        accessModes:
                          - ReadWriteOnce


          # cephBlockPools[0].spec.replicated.size
          # cephFileSystems[0].spec.metadataPool.replicated.size
          # cephObjectStores[0].spec.metadataPool.replicated.size
  destination:
    server: "https://kubernetes.default.svc"
    namespace: rook-ceph
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
