apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.jenkins.io/
      chart: jenkins
      targetRevision: 5.9.12
      helm:
        releaseName: jenkins
        valuesObject:
          controller:
            serviceType: LoadBalancer
          agent:
            podTemplates:
            dind: |
              - name: dind
                label: jenkins-dind
                serviceAccount: jenkins
                containers:
                  - name: dind
                    image: docker:29.4.0-rc
                    command: "/bin/sh -c"
                    args: "cat"
                    ttyEnabled: true
                    privileged: true
                    resourceRequestCpu: "400m"
                    resourceRequestMemory: "512Mi"
                    resourceLimitCpu: "1"
                    resourceLimitMemory: "1024Mi"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: jenkins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
